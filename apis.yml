aid: neuvector
name: NeuVector
description: >-
  NeuVector is an open source, full lifecycle container security platform
  maintained by SUSE. It provides vulnerability scanning, runtime protection,
  compliance monitoring, and a Layer 7 container firewall for Kubernetes
  environments. The NeuVector REST API allows automation of scanning,
  policy management, configuration, user administration, and federated
  cluster operations.
type: Index
