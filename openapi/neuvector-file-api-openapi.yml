        '200':
          description: Success. (1) Get a yaml file when export to local. (2) Get RESTRemoteExportData payload when export to remote repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTRemoteExportData'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTDlpSensorExport'
        description: Configuration data
        required: true
      operationId: postV1FileDlp
      x-operation-id-source: derived
  /v1/file/dlp/config:
    post:
      tags:
      - File
      description: Importing DLP config. The payload body is the content of the DLP config yaml file.
      summary: import DLP config
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: header
        name: X-Transaction-ID
        required: false
        schema:
          type: string
      - in: query
        name: scope
        required: false
        description: It imports the federated DLP configurations when the scope is fed. Otherwise it's for importing local DLP configurations
        schema:
          type: string
          enum:
          - local
          - fed
      responses:
        '200':
          description: Success
      requestBody:
        content:
          application/json:
            schema:
              type: string
          text/plain; charset=utf-8:
            schema:
              type: string
        description: DLP config yaml file
        required: true
      operationId: postV1FileDlpConfig
      x-operation-id-source: derived
  /v1/file/vulnerability/profile:
    post:
      tags:
      - File
      summary: Export vulnerability profile as a yaml format.
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: header
        name: X-Auth-Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success. (1) Get a yaml file when export to local. (2) Get RESTRemoteExportData payload when export to remote repository.
          content:
