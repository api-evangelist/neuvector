                $ref: '#/components/schemas/RESTRemoteExportData'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTFedConfigExport'
        description: Configuration data
        required: true
      operationId: postV1FileFedConfig
      x-operation-id-source: derived
  /v1/file/dlp:
    post:
      tags:
      - File
      summary: Export (federated) DLP configuration as a yaml format.
      security:
      - ApiKeyAuth: []
