components:
  schemas:
    RESTFedConfigExport:
      type: object
      properties:
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTResponseRulesExport:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: uint32
            example: 12
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTVulnProfilesExport:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
            example:
            - default
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTCompProfilesExport:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
            example:
            - default
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTGroupExport:
      type: object
      required:
      - groups
      properties:
        use_name_referral:
          type: boolean
          example: false
          description: Do not export groups' criteria. Instead, refer to NvGroupDefinition CRs for all groups involved in the export.
        groups:
          type: array
          items:
            type: string
            example: demo
        policy_mode:
          type: string
          example: Monitor
          enum:
          - Learn
          - Monitor
          - Protect
        profile_mode:
          type: string
          example: Monitor
          enum:
          - Learn
          - Monitor
          - Protect
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTImportTask:
      type: object
      required:
      - tid
      - ctrler_id
      - percentage
      properties:
        tid:
          type: string
          example: c5af897b62a258212ece91c0551d3a4a
        ctrler_id:
          type: string
          example: 6e60452b244b90456f3450c9fed0a50f57f4b849dcb74a5fad289e8116f32f36
        last_update_time:
          type: string
          format: date-time
          example: '2022-03-17T17:31:55.832768041Z'
        percentage:
          type: integer
          example: 100
        triggered_by:
          type: string
          example: admin
        status:
          type: string
          example: done
        temp_token:
          type: string
          example: ''
        fail_to_decrypt_key_fields:
          type: object
          description: Object key is kv key and value is array of cloaked fields that cannot be decrypted
          additionalProperties:
            type: array
            items:
              type: string
            example:
            - x509_cert
            - signing_cert
    RESTWafSensorExport:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            type: string
            example: test4321546242574254672462572452615362453
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTDlpSensorExport:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            type: string
          example:
          - ''
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTRemoteExportData:
      type: object
      properties:
        file_path:
          type: string
          description: the destination file path when exported to remote repository
    RESTAdmCtrlRulesExport:
      type: object
      properties:
        export_config:
          type: boolean
          example: true
        ids:
          type: array
          items:
            type: integer
            format: uint32
            example: 12
        remote_export_options:
          $ref: '#/components/schemas/RESTRemoteExportOptions'
    RESTImportTaskData:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/RESTImportTask'
    RESTRemoteExportOptions:
      type: object
      required:
      - file_path
      - remote_repository_nickname
      properties:
        file_path:
          type: string
          example: my_exports/example.yaml
        comment:
          type: string
          description: commit message
          example: commit for poc
        remote_repository_nickname:
          type: string
          example: default
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Apikey
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Find out more about NeuVector
  url: https://www.suse.com/products/neuvector/
