  /v1/file/group:
    get:
      tags:
      - File
      summary: (Obsolete, please use POST method.) Export the yaml format configuration file (…
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      responses:
        '200':
          description: Success. Get a yaml file.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTGroupExport'
        description: Configuration data
