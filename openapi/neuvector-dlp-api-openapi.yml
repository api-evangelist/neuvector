openapi: 3.2.0
info:
  description: Secure Docker and Kubernetes based container deployments with the NeuVector run-time security solution.
  version: 5.6.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: NeuVector DLP API
  contact:
    email: support@neuvector.com
tags:
- name: DLP
  description: Operations about DLP
paths:
  /v1/dlp/sensor:
    get:
      tags:
      - DLP
      summary: Get DLP sensors
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTDlpSensorsData'
      operationId: getV1DlpSensor
      x-operation-id-source: derived
    post:
      tags:
      - DLP
      summary: Create DLP sensor
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      responses:
        '200':
          description: Success
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTDlpSensorConfigData'
        description: Sensor data
        required: true
      operationId: postV1DlpSensor
      x-operation-id-source: derived
  /v1/dlp/sensor/{name}:
    get:
      tags:
      - DLP
      summary: Get DLP sensor detail
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: Sensor name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTDlpSensorData'
      operationId: getV1DlpSensorByName
      x-operation-id-source: derived
    patch:
      tags:
      - DLP
      summary: Configure DLP sensor
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: Sensor name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTDlpSensorConfigData'
        description: Sensor data
        required: true
      operationId: patchV1DlpSensorByName
      x-operation-id-source: derived
    delete:
      tags:
      - DLP
      summary: Delete DLP sensor
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: Sensor name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
      operationId: deleteV1DlpSensorByName
      x-operation-id-source: derived
  /v1/dlp/group:
    get:
      tags:
      - DLP
      summary: Get DLP group list
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTDlpGroupsData'
      operationId: getV1DlpGroup
      x-operation-id-source: derived
  /v1/dlp/group/{name}:
    get:
      tags:
      - DLP
      summary: Get DLP group detail
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: DLP group name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTDlpGroupData'
      operationId: getV1DlpGroupByName
      x-operation-id-source: derived
    patch:
      tags:
      - DLP
      summary: Configure DLP group
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: DLP group name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTDlpGroupConfigData'
        description: DLP group data
        required: true
      operationId: patchV1DlpGroupByName
      x-operation-id-source: derived
  /v1/dlp/rule:
    get:
      tags:
      - DLP
      summary: Get all DLP rules
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTDlpRulesData'
      operationId: getV1DlpRule
      x-operation-id-source: derived
  /v1/dlp/rule/{name}:
    get:
      tags:
      - DLP
      summary: Get DLP rule
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: DLP rule name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTDlpRuleData'
      operationId: getV1DlpRuleByName
      x-operation-id-source: derived
components:
  schemas:
    RESTDlpSensor:
      type: object
      required:
      - name
      - groups
      - rules
      - comment
      - predefine
      - cfg_type
      properties:
        name:
          type: string
          example: sensor.ssn
        groups:
          type: array
          items:
            type: string
          example:
          - external
          - nodes
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpRule'
        comment:
          type: string
          example: Sensor for SSN detection
        predefine:
          type: boolean
          example: true
        cfg_type:
          type: string
          enum:
          - user_created
          - ground
    RESTDlpGroupConfig:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: ssn
        status:
          type: boolean
          example: true
        delete:
          type: array
          items:
            type: string
            example: ''
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpSetting'
        replace:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpSetting'
    RESTDlpSensorData:
      type: object
      required:
      - sensor
      properties:
        sensor:
          $ref: '#/components/schemas/RESTDlpSensor'
    RESTDlpGroupConfigData:
      type: object
      required:
      - config
      properties:
        config:
          $ref: '#/components/schemas/RESTDlpGroupConfig'
    RESTDlpGroupData:
      type: object
      required:
      - dlp_group
      properties:
        dlp_group:
          $ref: '#/components/schemas/RESTDlpGroup'
    RESTDlpSensorsData:
      type: object
      required:
      - sensors
      properties:
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpSensor'
    RESTDlpGroup:
      type: object
      required:
      - name
      - status
      - sensors
      properties:
        name:
          type: string
          example: nodes
        status:
          type: boolean
          example: true
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpSetting'
    RESTDlpRuleDetail:
      type: object
      required:
      - sensors
      - rules
      properties:
        sensors:
          type: array
          items:
            type: string
          example:
          - ssn
          - credit
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpRule'
    RESTDlpSensorConfigData:
      type: object
      required:
      - config
      properties:
        config:
          $ref: '#/components/schemas/RESTDlpSensorConfig'
    RESTCriteriaEntry:
      type: object
      required:
      - key
      - value
      - op
      properties:
        key:
          type: string
          example: pattern
        value:
          type: string
          example: '[0-9]'
        op:
          type: string
          example: regex
    RESTDlpSetting:
      type: object
      required:
      - name
      - action
      properties:
        name:
          type: string
          example: sensor.ssn
        action:
          type: string
          example: log
        comment:
          type: string
          example: logging sensor ssn
    RESTDlpRuleData:
      type: object
      required:
      - rule
      properties:
        rule:
          $ref: '#/components/schemas/RESTDlpRuleDetail'
    RESTDlpGroupsData:
      type: object
      required:
      - dlp_groups
      properties:
        dlp_groups:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpGroup'
    RESTDlpRulesData:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpRule'
    RESTDlpRule:
      type: object
      required:
      - name
      - id
      - patterns
      - cfg_type
      properties:
        name:
          type: string
          example: testrule413251424153561246153614615462515134635
        id:
          type: integer
          format: uint32
          example: 4001
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/RESTCriteriaEntry'
        cfg_type:
          type: string
          enum:
          - user_created
          - ground
    RESTDlpSensorConfig:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: sensor.creditcard
        change:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpRule'
        delete:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpRule'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RESTDlpRule'
        comment:
          type: string
          example: Sensor for Credit Card detection
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Apikey
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Find out more about NeuVector
  url: https://www.suse.com/products/neuvector/
