components:
  schemas:
    RESTScanPlatformSummaryData:
      type: object
      required:
      - platforms
      properties:
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/RESTScanPlatformSummary'
    RESTScanModule:
      type: object
      required:
      - name
      - version
      - source
      properties:
        name:
          type: string
          example: openssl
        file:
          type: string
          example: example.jar
        version:
          type: string
          example: '1.011'
        source:
          type: string
          example: github
        cves:
          type: array
          items:
            $ref: '#/components/schemas/RESTModuleCve'
        cpes:
          type: array
          items:
            type: string
            example: ''
    RESTScanPlatformSummary:
      type: object
      required:
      - platform
      - kube_version
      - openshift_version
      - status
      - high
      - medium
      - result
      - scanned_timestamp
      - scanned_at
      - base_os
      - scanner_version
      - cvedb_create_time
      properties:
        platform:
          type: string
          example: Kubernetes
        kube_version:
          type: string
          example: 1.19.2
        openshift_version:
          type: string
          example: ''
        status:
          type: string
          example: finished
        high:
          type: integer
          example: 3
        medium:
          type: integer
          example: 1
        result:
          type: string
          example: succeeded
        scanned_timestamp:
          type: integer
          format: int64
          example: 1593217223
        scanned_at:
          type: string
          example: '2020-06-27T00:20:23Z'
        base_os:
          type: string
          example: ''
        scanner_version:
          type: string
          example: '1.932'
        cvedb_create_time:
          type: string
          example: '2020-06-19T10:32:18Z'
    RESTScanRepoReportData:
      type: object
      required:
      - report
      properties:
        report:
          $ref: '#/components/schemas/RESTScanRepoReport'
    RESTGCRKeyConfig:
      type: object
      properties:
        json_key:
          type: string
          example: ''
    RESTScanConfigResp:
      type: object
      required:
      - config
      properties:
        config:
          $ref: '#/components/schemas/RESTScanConfig'
    RESTRegistrySummaryData:
      type: object
      required:
      - summary
      properties:
        summary:
          $ref: '#/components/schemas/RESTRegistrySummary'
    RESTScanImageSummary:
      type: object
      required:
      - image
      - image_id
      - author
      - status
      - high
      - medium
      - result
      - scanned_timestamp
      - scanned_at
      - created_at
      - base_os
      - scanner_version
      - cvedb_create_time
      properties:
        image:
          type: string
          example: calico/node:v3.8.2
        image_id:
          type: string
          example: 11cd78b9e13d420f93d5d5b2611e803bda012ae5cd8b476d4cc328dc133773ce
        author:
          type: string
          example: ''
        status:
          type: string
          example: finished
        high:
          type: integer
          example: 26
        medium:
          type: integer
          example: 33
        result:
          type: string
          example: succeeded
