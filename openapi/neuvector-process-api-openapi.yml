openapi: 3.2.0
info:
  description: Secure Docker and Kubernetes based container deployments with the NeuVector run-time security solution.
  version: 5.6.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: NeuVector Process API
  contact:
    email: support@neuvector.com
tags:
- name: Process
  description: Operations about Process Profile
paths:
  /v1/process_profile:
    get:
      tags:
      - Process
      summary: Get a list of process profiles
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: query
        name: scope
        required: false
        description: When set to fed, returned fed process profiles. When set to local, returned local process profiles. If there is no query string 'scope', all process profiles will be returned.
        schema:
          type: string
          enum:
          - fed
          - local
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTProcessProfilesData'
      operationId: getV1ProcessProfile
      x-operation-id-source: derived
  /v1/process_profile/{name}:
    get:
      tags:
      - Process
      summary: Get a process profile
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: Process profile name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTProcessProfileData'
      operationId: getV1ProcessProfileByName
      x-operation-id-source: derived
    patch:
      tags:
      - Process
      summary: Update a process profile
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: Process profile name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESTProcessProfileConfigData'
        description: Process profile configure data
        required: true
      operationId: patchV1ProcessProfileByName
      x-operation-id-source: derived
  /v1/process_rules/{uuid}:
    get:
      tags:
      - Process
      summary: Get a process rule
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: uuid
        description: Process rule uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESTProcessRulesResp'
      operationId: getV1ProcessRulesByUuid
      x-operation-id-source: derived
components:
  schemas:
    RESTProcessProfileConfig:
      type: object
      required:
      - group
      properties:
        group:
          type: string
          example: myGroup
        alert_disabled:
          type: boolean
          example: false
        hash_enabled:
          type: boolean
          example: true
        process_change_list:
          type: array
          items:
            $ref: '#/components/schemas/RESTProcessProfileEntryConfig'
        process_delete_list:
          type: array
          items:
            $ref: '#/components/schemas/RESTProcessProfileEntryConfig'
    RESTProcessRulesResp:
      type: object
      properties:
        process_rules:
          type: array
          items:
            $ref: '#/components/schemas/RESTProcessUuidEntry'
    RESTProcessProfileEntry:
      type: object
      required:
      - name
      - action
      - cfg_type
      - uuid
      - created_timestamp
      - last_modified_timestamp
      properties:
        name:
          type: string
          example: name
        path:
          type: string
          example: path
        user:
          type: string
          example: user
        uid:
          type: integer
          format: int32
          example: 1273
        action:
          type: string
          example: allow
        cfg_type:
          type: string
          enum:
          - learned
          - user_created
          - ground
          - federal
          - system_defined
        uuid:
          type: string
          format: uuid
          example: 5654bfac-0011-4678-8e67-9eda136f18b1
        group:
          type: string
          example: nodes
        created_timestamp:
          type: integer
          format: int64
          example: 1516561258
        last_modified_timestamp:
          type: integer
          format: int64
          example: 1516561268
    RESTProcessProfileEntryConfig:
      type: object
      required:
      - name
      - path
      - action
      - group
      properties:
        name:
          type: string
          example: myEntryConfig
        path:
          type: string
          example: ''
        action:
          type: string
          example: monitor
        group:
          type: string
          example: myGroup
    RESTProcessProfileData:
      type: object
      required:
      - process_profile
      properties:
        process_profile:
          $ref: '#/components/schemas/RESTProcessProfile'
    RESTProcessProfileConfigData:
      type: object
      required:
      - process_profile_config
      properties:
        process_profile_config:
          $ref: '#/components/schemas/RESTProcessProfileConfig'
    RESTProcessProfile:
      type: object
      required:
      - group
      - mode
      - process_list
      properties:
        group:
          type: string
          example: admin
        alert_disabled:
          type: boolean
          example: false
        hash_enabled:
          type: boolean
          example: true
        mode:
          type: string
          example: ''
        process_list:
          type: array
          items:
            $ref: '#/components/schemas/RESTProcessProfileEntry'
    RESTProcessProfilesData:
      type: object
      required:
      - process_profiles
      properties:
        process_profiles:
          type: array
          items:
            $ref: '#/components/schemas/RESTProcessProfile'
    RESTProcessUuidEntry:
      type: object
      properties:
        active:
          type: integer
          example: 1
        group:
          type: string
          example: nodes
        rule:
          $ref: '#/components/schemas/RESTProcessProfileEntry'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Apikey
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Find out more about NeuVector
  url: https://www.suse.com/products/neuvector/
