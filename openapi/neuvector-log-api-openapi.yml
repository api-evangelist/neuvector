      level:
        type: string
        example: INFO
      reported_timestamp:
        type: integer
        format: int64
        example: 1516832670
      reported_at:
        type: string
        format: date-time
        example: 2018-01-24 22:24:30+00:00
      cluster_name:
        type: string
        example: cluster1
      response_rule_id:
        type: integer
