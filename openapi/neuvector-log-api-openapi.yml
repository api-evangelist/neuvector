    - reported_at
    - cluster_name
    - host_id
    - host_name
    - enforcer_id
    - enforcer_name
    - controller_id
    - controller_name
    - workload_id
    - workload_name
    - workload_domain
    - workload_image
    - workload_service
    - category
    - user
    - user_roles
    - user_addr
    - user_session
    - message
    properties:
      name:
        type: string
