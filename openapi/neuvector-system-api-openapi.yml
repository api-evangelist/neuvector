    - running_pods
    - services
    - policy_rules
    - scanners
    - platform
    - kube_version
    - openshift_version
    - cvedb_version
    - cvedb_create_time
    - component_versions
    properties:
      hosts:
        type: integer
        example: 1
      controllers:
        type: integer
        example: 1
      enforcers:
        type: integer
        example: 1
      disconnected_enforcers:
        type: integer
        example: 1
      workloads:
        type: integer
        example: 0
      running_workloads:
        type: integer
        example: 100
      running_pods:
        type: integer
        example: 100
      services:
        type: integer
        example: 10
      policy_rules:
        type: integer
        example: 2
      scanners:
        type: integer
        example: 3
      platform:
        type: string
        example: Docker
      kube_version:
        type: string
        example: 1.19.2
      openshift_version:
        type: string
        example: ''
      cvedb_version:
        type: string
        example: '1.011'
      cvedb_create_time:
        type: string
        format: date-time
        example: 2018-06-20 19:00:53+00:00
      component_versions:
        type: array
        items:
