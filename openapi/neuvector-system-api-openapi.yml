        example: slack-webhook
      url:
        type: string
        example: https://neuvector.slack.com/archives/C8AU75GKE
      enable:
        type: boolean
        example: true
      use_proxy:
        type: boolean
        example: false
      type:
        type: string
        enum:
        - ''
        - Slack
        - JSON
        - Teams
      cfg_type:
        type: string
        enum:
        - user_created
        - ground
        - federal
