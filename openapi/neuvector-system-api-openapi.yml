    properties:
      mode_auto_d2m:
        type: boolean
        example: false
      mode_auto_d2m_duration:
        type: integer
        format: int64
        example: 1505755716
      mode_auto_m2p:
        type: boolean
        example: false
      mode_auto_m2p_duration:
        type: integer
        format: int64
        example: 1505755716
  RESTWebhook:
