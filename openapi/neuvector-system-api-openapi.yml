      ibmsa_ep_enabled:
        type: boolean
        example: false
      ibmsa_ep_start:
        type: integer
        format: uint32
        example: 1
      ibmsa_ep_dashboard_url:
        type: string
        example: ''
      ibmsa_ep_connected_at:
        type: string
        example: ''
  RESTSystemConfig:
    type: object
    required:
    - new_service_policy_mode
    - new_service_profile_baseline
    - unused_group_aging
    - syslog_ip
    - syslog_ip_proto
    - syslog_port
    - syslog_level
    - syslog_status
    - syslog_categories
    - syslog_in_json
    - single_cve_per_syslog
    - syslog_cve_in_layers
    - output_event_to_logs
    - auth_order
    - auth_by_platform
    - rancher_ep
    - webhooks
    - cluster_name
    - controller_debug
    - monitor_service_mesh
    - registry_http_proxy_status
    - registry_https_proxy_status
    - registry_http_proxy
    - registry_https_proxy
    - ibmsa_ep_enabled
