swagger: '2.0'
info:
  description: Secure Docker and Kubernetes based container deployments with the NeuVector run-time security solution.
  version: 5.6.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: NeuVector System API
  contact:
    email: support@neuvector.com
schemes:
- https
tags:
- name: System
  description: Operations about System
paths:
  /v1/system/summary:
    get:
      tags:
      - System
      summary: System summary
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/RESTSystemSummaryData'
  /v1/system/config:
    get:
      tags:
      - System
      summary: System get configure
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      produces:
      - application/json
      parameters:
      - in: query
        name: scope
        type: string
        required: false
        enum:
        - fed
        - local
        description: When set the scope to be fed, it will return the fed system configures. When set the scope to be local, it will return the local system configures. If there is no query string 'scope', it will return all system configures.
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/RESTSystemConfigData'
    patch:
      tags:
      - System
      summary: System configure
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      consumes:
      - application/json
      parameters:
      - in: body
        name: body
        description: System configure data
        required: true
        schema:
          $ref: '#/definitions/RESTSystemConfigConfigData'
      responses:
        '200':
          description: Success
  /v2/system/config:
    get:
      tags:
      - System
      summary: Get system configuration (starting from 5.0, rest client should call this api.)
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      produces:
      - application/json
      parameters:
      - in: query
        name: scope
        type: string
        required: false
        enum:
        - fed
        - local
        description: When set the scope to be fed, it will return the fed system configures. When set the scope to be local, it will return the local system configures. If there is no query string 'scope', it will return all system configures.
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/RESTSystemConfigDataV2'
    patch:
      tags:
      - System
      summary: System configure (starting from 5.0, rest client should call this api.)
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      consumes:
      - application/json
      parameters:
      - in: body
        name: body
        description: System configure data
        required: true
        schema:
          $ref: '#/definitions/RESTSystemConfigConfigDataV2'
      responses:
        '200':
          description: Success
  /v1/system/alerts:
    get:
      tags:
      - System
      summary: System alerts
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/RESTNvAlerts'
  /v1/system/config/webhook:
    post:
      tags:
      - System
      summary: Create system webhook
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      consumes:
      - application/json
      parameters:
      - in: body
        name: body
        description: System configure data
        required: true
        schema:
          $ref: '#/definitions/RESTSystemWebhookConfigData'
      responses:
        '200':
          description: Success
  /v1/system/config/webhook/{name}:
    patch:
      tags:
      - System
      summary: Configure system webhook
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      consumes:
      - application/json
      parameters:
      - in: path
        name: name
        description: System webhook name
        required: true
        type: string
      - in: query
        name: scope
        type: string
        required: false
        enum:
        - fed
        - local
        description: When set the scope to be fed, it will update the fed level webhook. When set the scope to be local, it will update the local webhook. If there is no query string 'scope', it will use 'local' as the default value.
      - in: body
        name: body
        description: System configure data
        required: true
        schema:
          $ref: '#/definitions/RESTSystemWebhookConfigData'
      responses:
        '200':
          description: Success
    delete:
      tags:
      - System
      summary: Delete system webhook
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      parameters:
      - in: path
        name: name
        description: System webhook name
        required: true
        type: string
      - in: query
        name: scope
        type: string
        required: false
        enum:
        - fed
        - local
        description: When set the scope to be fed, it will delete the fed level webhook. When set the scope to be local, it will delete the local webhook. If there is no query string 'scope', it will use 'local' as the default value.
      responses:
        '200':
          description: Success
  /v1/system/request:
    post:
      tags:
      - System
      summary: System request
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      consumes:
      - application/json
      parameters:
      - in: body
        name: body
        description: System request data
        required: true
        schema:
          $ref: '#/definitions/RESTSystemRequestData'
      responses:
        '200':
          description: Success
  /v1/system/score/metrics:
    get:
      tags:
      - System
      summary: Get system score metrics data
      security:
      - ApiKeyAuth: []
      - TokenAuth: []
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/RESTScoreMetricsData'
definitions:
  RESTSystemConfigConfig:
    type: object
    properties:
      new_service_policy_mode:
        type: string
        example: Discover
      new_service_profile_baseline:
        type: string
        example: zero-drift
      unused_group_aging:
        type: integer
        format: uint8
        example: 123
      syslog_ip:
        type: string
        example: ''
      syslog_ip_proto:
        type: integer
        format: uint8
        example: 6
      syslog_port:
        type: integer
        format: uint16
        example: 514
      syslog_level:
        type: string
        example: INFO
      syslog_status:
        type: boolean
        example: false
      syslog_categories:
        type: array
        items:
          type: string
        example:
        - event
        - violation
        - threat
        - incident
      syslog_in_json:
        type: boolean
        example: true
      syslog_server_cert:
        type: string
        example: E7B0OS/N3KMVCL6KNMZ2+LOV90S7854NSD84P0BF
      single_cve_per_syslog:
        type: boolean
        example: true
      syslog_cve_in_layers:
        type: boolean
        example: true
      output_event_to_logs:
        type: boolean
        example: true
      auth_order:
        type: array
        items:
          type: string
          example: ''
      auth_by_platform:
        type: boolean
        example: true
      rancher_ep:
        type: string
        example: ''
      webhooks:
        type: array
        items:
          $ref: '#/definitions/RESTWebhook'
      cluster_name:
        type: string
        example: cluster1
      controller_debug:
        type: array
        items:
          type: string
          enum:
          - cpath
          - conn
          - mutex
          - scan
          - cluster
          - k8s_monitor
        example:
        - cpath
        - scan
        - k8s_monitor
      monitor_service_mesh:
        type: boolean
        example: true
      registry_http_proxy_status:
        type: boolean
        example: true
      registry_https_proxy_status:
        type: boolean
        example: false
      registry_http_proxy:
        $ref: '#/definitions/RESTProxy'
      registry_https_proxy:
        $ref: '#/definitions/RESTProxy'
      ibmsa_ep_enabled:
        type: boolean
        example: false
      ibmsa_ep_dashboard_url:
        type: string
        example: ''
      xff_enabled:
        type: boolean
        example: false
      scanner_autoscale:
        $ref: '#/definitions/RESTSystemConfigAutoscale'
      no_telemetry_report:
        type: boolean
        example: false
      remote_repositories:
        type: array
        items:
          $ref: '#/definitions/RESTRemoteRepository'
  RESTSystemConfigAutoscale:
    type: object
    required:
    - strategy
    - min_pods
    - max_pods
    properties:
      strategy:
        type: string
        enum:
        - ''
        - immediate
        - delayed
      min_pods:
        type: integer
        format: uint32
        example: 1
      max_pods:
        type: integer
        format: uint32
        example: 3
  RESTSysNetConfigConfig:
    type: object
    properties:
      net_service_status:
        type: boolean
        example: true
      net_service_policy_mode:
        type: string
        example: ''
      disable_net_policy:
        type: boolean
        example: false
      detect_unmanaged_wl:
        type: boolean
        example: true
      strict_group_mode:
        type: boolean
        example: true
  RESTSysAtmoConfigConfig:
    type: object
    properties:
      mode_auto_d2m:
        type: boolean
        example: false
      mode_auto_d2m_duration:
        type: integer
        format: int64
        example: 1505755716
      mode_auto_m2p:
        type: boolean
        example: false
      mode_auto_m2p_duration:
        type: integer
        format: int64
        example: 1505755716
  RESTExposedEndpoint:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      display_name:
        type: string
      pod_name:
        type: string
      service:
        type: string
      severity:
        type: string
      critical:
        type: integer
      high:
        type: integer
      medium:
        type: integer
      policy_mode:
        type: string
      policy_action:
        type: string
      protocols:
        type: array
        items:
          type: string
      applications:
        type: array
        items:
          type: string
      ports:
        type: array
        items:
          type: string
      entries:
        type: array
        items:
          $ref: '#/definitions/RESTConversationReportEntry'
  RESTConversationReportEntry:
    type: object
    properties:
      bytes:
        type: integer
        format: uint64
      sessions:
        type: integer
        format: uint32
      port:
        type: string
      application:
        type: string
      policy_action:
        type: string
      client_ip:
        type: string
      server_ip:
        type: string
      fqdn:
        type: string
      last_seen_at:
        type: integer
        format: int64
  RESTSystemConfigTls:
    type: object
    properties:
      enable_tls_verification:
        type: boolean
        example: false
      cacerts:
        type: array
        items:
          type: string
        example:
        - '-----BEGIN CERTIFICATE-----...'
        - '-----BEGIN CERTIFICATE-----...'
  RESTSystemConfigProxyV2:
    type: object
    required:
    - registry_http_proxy_status
    - registry_https_proxy_status
    - registry_http_proxy
    - registry_https_proxy
    properties:
      registry_http_proxy_status:
        type: boolean
        example: true
      registry_https_proxy_status:
        type: boolean
        example: false
      registry_http_proxy:
        $ref: '#/definitions/RESTProxy'
      registry_https_proxy:
        $ref: '#/definitions/RESTProxy'
      registry_http_proxy_cfg:
        $ref: '#/definitions/RESTProxyConfig'
      registry_https_proxy_cfg:
        $ref: '#/definitions/RESTProxyConfig'
  RESTSystemConfigSyslogCfgV2:
    type: object
    properties:
      syslog_ip:
        type: string
        example: ''
      syslog_ip_proto:
        type: integer
        format: uint8
        example: 6
      syslog_port:
        type: integer
        format: uint16
        example: 514
      syslog_level:
        type: string
        example: INFO
      syslog_status:
        type: boolean
        example: true
      syslog_categories:
        type: array
        items:
          type: string
        example:
        - event
        - violation
        - threat
        - incident
      syslog_in_json:
        type: boolean
        example: true
      single_cve_per_syslog:
        type: boolean
        example: true
      syslog_cve_in_layers:
        type: boolean
        example: true
      syslog_server_cert:
        type: string
        example: E7B0OS/N3KMVCL6KNMZ2+LOV90S7854NSD84P0BF
      output_event_to_logs:
        type: boolean
        example: true
  RESTSystemConfigConfigDataV2:
    type: object
    description: it leverages RESTSystemConfigConfigData in apis.go
    properties:
      config_v2:
        $ref: '#/definitions/RESTSystemConfigConfigV2'
      fed_config:
        $ref: '#/definitions/RESTFedSystemConfigConfig'
      net_config:
        $ref: '#/definitions/RESTSysNetConfigConfig'
      atmo_config:
        $ref: '#/definitions/RESTSysAtmoConfigConfig'
  RESTSystemConfigMiscCfgV2:
    type: object
    properties:
      unused_group_aging:
        type: integer
        format: uint8
        example: 30
      cluster_name:
        type: string
        example: cluster1
      controller_debug:
        type: array
        items:
          type: string
          enum:
          - cpath
          - conn
          - mutex
          - scan
          - cluster
          - k8s_monitor
        example:
        - scan
        - k8s_monitor
      monitor_service_mesh:
        type: boolean
        example: true
      xff_enabled:
        type: boolean
        example: false
      no_telemetry_report:
        type: boolean
        example: false
  RESTSystemConfigAuthCfgV2:
    type: object
    properties:
      auth_order:
        type: array
        items:
          type: string
        example:
        - local
        - ldap
      auth_by_platform:
        type: boolean
        example: true
      rancher_ep:
        type: string
        example: https://my-rancher.test:30000
  RESTSystemConfigIBMSAV2:
    type: object
    required:
    - ibmsa_ep_enabled
    - ibmsa_ep_start
    - ibmsa_ep_dashboard_url
    - ibmsa_ep_connected_at
