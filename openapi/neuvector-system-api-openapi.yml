    - no_telemetry_report
    - cfg_type
    properties:
      configured_internal_subnets:
        type: array
        items:
          type: string
        example:
        - 69.89.0.0/16
        - 172.217.5.0/23
      unused_group_aging:
        type: integer
        format: uint8
        example: 123
      cluster_name:
        type: string
        example: cluster1
      controller_debug:
        type: array
        items:
          type: string
          enum:
          - cpath
          - conn
          - mutex
          - scan
          - cluster
          - k8s_monitor
        example:
        - scan
        - k8s_monitor
      csp_type:
        type: string
        example: aws
      monitor_service_mesh:
        type: boolean
        example: true
      xff_enabled:
        type: boolean
        example: false
      no_telemetry_report:
        type: boolean
        example: false
      cfg_type:
        type: string
        enum:
        - user_created
        - ground
        - federal
  RESTFedSystemConfigConfig:
    type: object
    properties:
      webhooks:
        type: array
        items:
          $ref: '#/definitions/RESTWebhook'
  RESTComplianceProfileEntry:
    type: object
