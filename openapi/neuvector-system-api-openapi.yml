        example: ''
      username:
        type: string
        example: username
      password:
        type: string
        format: password
        example: password
    description: Define proxy settings.
  RESTSystemRequest:
    type: object
    properties:
      baseline_profile:
        type: string
        example: Zero-Drift
      policy_mode:
        type: string
        example: Discover
